name: Windows build

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    # 릴리스에 자산을 붙이려면 쓰기 권한이 필요하다. 기본 토큰은 읽기 전용이다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish windows/MeetingScribe/MeetingScribe.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = if ($tag) { $tag.TrimStart('v') } else { "dev" }
          $name = "MeetingScribe-$version-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "패키지: $name"

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingScribe-win-x64
          path: ${{ env.ZIP_NAME }}

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} $env:ZIP_NAME --clobber
